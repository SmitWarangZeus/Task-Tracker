<!DOCTYPE html>
<head>
    <title>Task Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <h1>Task Tracker</h1>
    <div class="container1" style="width: 70%;">
        <div class="form-floating">
            <input class="form-control" type="text" id="task-name" placeholder="Enter task name">
            <label for="task-name">Task name:</label>
        </div>
        <div class="form-floating">
            <input class="form-control" type="text" id="task-desc" placeholder="Enter description of task">
            <label for="task-desc">Task description:</label>
        </div>
        <div class="form-floating">
            <input class="form-control" type="date" id="task-due">
            <label for="task-due">Due date:</label>
        </div>
        <button type="button" id="addTask" onclick="addTask()" class="btn btn-primary" style="margin-left: 5px; margin-bottom: 5%;">Add Task</button>
        <h3>Tasks:</h3>
        <table id="table" class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Task Name</th>
                    <th>Task Desc</th>
                    <th>Due Date</th>
                    <th>Status</th>
                    <th>Delete Task</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</body>
<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</html>
